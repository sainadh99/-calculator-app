name: Secure CI/CD Pipeline

on:
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup build metadata
      - name: Set Build Metadata
        run: |
          echo "BUILD_TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      # 3️⃣ Docker login
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build & push Docker image
      - name: Build & Push Docker Image
        run: |
          docker build -t sainadh99/calculator-app:latest \
                       -t sainadh99/calculator-app:${{ env.BUILD_TAG }} \
                       --build-arg BUILD_DATE=${{ env.BUILD_DATE }} .
          docker push sainadh99/calculator-app:latest
          docker push sainadh99/calculator-app:${{ env.BUILD_TAG }}

      # 5️⃣ Secure Deploy
      - name: Secure Deployment
        run: |
          docker stop calculator-app || true
          docker rm calculator-app || true
          docker network inspect calc-network >/dev/null 2>&1 || \
            docker network create calc-network

          docker run -d --name calculator-app --restart unless-stopped \
            --network calc-network -p 80:3000 \
            --memory=512m --cpus=1.0 --pids-limit=100 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            sainadh99/calculator-app:${{ env.BUILD_TAG }}

      # 6️⃣ Health Check
      - name: Health Check
        run: |
          sleep 20
          if ! docker ps | grep -q calculator-app; then
            echo "❌ Container not running!"
            exit 1
          fi
          echo "✅ Container is running and healthy."

      # 7️⃣ Cleanup
      - name: Cleanup Old Images
        run: |
          docker image prune -af
          docker container prune -f
          echo "✅ Cleanup complete."

      # 8️⃣ Success Message
      - name: Deployment Summary
        run: |
          echo "🎉 Deployment successful!"
          echo "App: Calculator App"
          echo "Version: ${{ env.BUILD_TAG }}"
          echo "Deployed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
